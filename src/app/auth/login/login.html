<!-- A centered card holding the login form. -->
<div class="auth-wrapper">
  <div class="auth-card">
    <!-- App title shown at the top of the card. -->
    <h1 class="auth-title">💰 Finance Tracker</h1>
    <p class="auth-subtitle">Sign in to manage your money</p>

    <!-- The login form. (ngSubmit) runs onSubmit() when the user submits. -->
    <form (ngSubmit)="onSubmit()" novalidate>
      <!-- Email input box, bound to the "email" field with [(ngModel)]. -->
      <label class="field-label">Email</label>
      <input class="field-input" type="email" name="email" autocomplete="email"
             [(ngModel)]="email" required placeholder="you@example.com" [disabled]="loading" />

      <!-- Secret input box, bound to the "secretValue" field. type="password" hides the text. -->
      <label class="field-label">Password</label>
      <input class="field-input" type="password" name="secret" autocomplete="current-password"
             [(ngModel)]="secretValue" required placeholder="Your password" [disabled]="loading" />

      <!-- Toast-like alert for login errors. -->
      <div class="toast error-toast" *ngIf="errorMessage" role="alert" aria-live="assertive" aria-label="Login error">
        <span>{{ errorMessage }}</span>
        <button class="toast-close" type="button" (click)="errorMessage = ''" aria-label="Dismiss error">✕</button>
      </div>

      <!-- The submit button. It is disabled while loading to prevent double clicks. -->
      <button class="primary-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <!-- A link to the registration page for new users. -->
    <p class="auth-footer">
      New here? <a routerLink="/register">Create an account</a>
    </p>
  </div>
</div>
