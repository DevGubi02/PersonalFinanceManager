<div class="global-toast" *ngIf="toast.message()" role="alert" aria-live="assertive">
  {{ toast.message() }}
</div>

<!-- Mobile top bar (visible only on small screens) -->
<div class="mobile-top" role="banner">
  <button class="mobile-hamburger" type="button" (click)="toggleMenu()" aria-label="Open menu">☰</button>
  <div class="mobile-brand">💰 Finance Tracker</div>
  <button class="mobile-profile-btn" type="button" (click)="toggleProfile()" aria-label="Open profile">
    <svg class="profile-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5z" fill="currentColor"/>
      <path d="M2 22c0-3.866 3.582-7 10-7s10 3.134 10 7v1H2v-1z" fill="currentColor"/>
    </svg>
  </button>
  <div class="mobile-profile-dropdown" *ngIf="profileOpen()">
    <div class="mobile-user-name">{{ auth.userName() || 'User' }}</div>
    <div class="dropdown-section theme-section">
      <button
        class="theme-menu-btn"
        type="button"
        (click)="toggleThemePopup()"
        [attr.aria-expanded]="themePopupOpen()"
      >
        <span>Theme</span>
        <span class="theme-current">
          {{ getThemeLabel(currentTheme()) }}
        </span>
      </button>
    </div>

    <button class="menu-link" type="button" (click)="logout()">Logout</button>
  </div>
</div>

<!-- Desktop top bar: only shows page title and profile -->
<div class="topbar-desktop" role="banner">
  <div class="topbar-title">💰 Finance Tracker</div>

  <div class="topbar-profile">
    <span class="profile-name">{{ auth.userName() || 'User' }}</span>
    <button class="profile-btn" type="button" (click)="toggleProfile()" aria-label="Open profile menu">
      <svg class="profile-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5z" fill="currentColor"/>
        <path d="M2 22c0-3.866 3.582-7 10-7s10 3.134 10 7v1H2v-1z" fill="currentColor"/>
      </svg>
    </button>

    <div class="profile-dropdown" *ngIf="profileOpen()">
      <div class="dropdown-section theme-section">
        <button
          class="theme-menu-btn"
          type="button"
          (click)="toggleThemePopup()"
          [attr.aria-expanded]="themePopupOpen()"
        >
          <span>Theme</span>
          <span class="theme-current">
            {{ getThemeLabel(currentTheme()) }}
          </span>
        </button>
      </div>

      <button class="menu-link" type="button" (click)="logout()">Logout</button>
    </div>
  </div>
</div>

<div class="theme-modal-backdrop" *ngIf="themePopupOpen()" (click)="toggleThemePopup()" aria-hidden="true"></div>
<div class="theme-modal" *ngIf="themePopupOpen()" role="dialog" aria-modal="true" aria-label="Choose color theme">
  <div class="theme-modal-header">
    <h3>Choose Theme</h3>
    <button class="theme-close-btn" type="button" (click)="toggleThemePopup()" aria-label="Close theme selector">✕</button>
  </div>

  <div class="swatch-grid full-size">
    <button type="button" class="theme-swatch" data-theme="light" [class.active]="currentTheme() === 'light'" (click)="setTheme('light')" aria-label="Light theme">
      <span class="swatch-circle sw-light"></span>
      <span class="swatch-label">Light</span>
    </button>
    <button type="button" class="theme-swatch" data-theme="midnight" [class.active]="currentTheme() === 'midnight'" (click)="setTheme('midnight')" aria-label="Midnight theme">
      <span class="swatch-circle sw-midnight"></span>
      <span class="swatch-label">Midnight</span>
    </button>
    <button type="button" class="theme-swatch" data-theme="forest" [class.active]="currentTheme() === 'forest'" (click)="setTheme('forest')" aria-label="Forest theme">
      <span class="swatch-circle sw-forest"></span>
      <span class="swatch-label">Forest</span>
    </button>
    <button type="button" class="theme-swatch" data-theme="ocean" [class.active]="currentTheme() === 'ocean'" (click)="setTheme('ocean')" aria-label="Ocean theme">
      <span class="swatch-circle sw-ocean"></span>
      <span class="swatch-label">Ocean</span>
    </button>
    <button type="button" class="theme-swatch" data-theme="sunset" [class.active]="currentTheme() === 'sunset'" (click)="setTheme('sunset')" aria-label="Sunset theme">
      <span class="swatch-circle sw-sunset"></span>
      <span class="swatch-label">Sunset</span>
    </button>
    <button type="button" class="theme-swatch" data-theme="lavender" [class.active]="currentTheme() === 'lavender'" (click)="setTheme('lavender')" aria-label="Lavender theme">
      <span class="swatch-circle sw-lavender"></span>
      <span class="swatch-label">Lavender</span>
    </button>
  </div>
</div>

<!-- Sidebar navigation: fixed on desktop, off-canvas on mobile. -->
<aside class="sidebar" [class.open]="menuOpen()" role="navigation" aria-label="Main menu">
  <div class="sidebar-top">
    <button class="hamburger" type="button" (click)="toggleMenu()" aria-label="Toggle menu">☰</button>
  </div>

  <nav class="sidebar-links">
    <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
    <a routerLink="/transactions" routerLinkActive="active" (click)="closeMenu()">Transactions</a>
    <a routerLink="/categories" routerLinkActive="active" (click)="closeMenu()">Categories</a>
    <a routerLink="/budgets" routerLinkActive="active" (click)="closeMenu()">Budgets</a>
    <a routerLink="/reports" routerLinkActive="active" (click)="closeMenu()">Reports</a>
  </nav>

  <!-- Sidebar footer intentionally left minimal; profile actions moved to profile dropdown -->
  <div class="sidebar-footer"></div>
</aside>

<!-- Overlay for mobile when sidebar is open. -->
<div class="sidebar-overlay" *ngIf="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>
