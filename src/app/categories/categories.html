<!-- The shared top navigation bar. -->
<app-nav></app-nav>

<div class="page">
  <!-- <h2 class="page-title">Categories</h2> -->

  <!-- Form to add a new category. -->
  <form class="add-form" (ngSubmit)="add()" novalidate>
    <div class="field-group">
      <label for="category-name">Category Name</label>
      <input id="category-name" name="name" type="text" [class.invalid-field]="validationAttempted && !newItem.name.trim()" [(ngModel)]="newItem.name" placeholder="Category name" required />
    </div>

    <div class="field-group">
      <label for="category-type">Type</label>
      <select id="category-type" name="type" [(ngModel)]="newItem.type">
        <option value="Expense">Expense</option>
        <option value="Income">Income</option>
      </select>
    </div>

    <!-- Add button, disabled while saving. Note: saving() reads the signal's value. -->
    <div class="field-group action-group">
      <label class="sr-only" for="category-submit">Action</label>
      <button id="category-submit" type="submit" class="add-btn" [disabled]="saving()">{{ saving() ? 'Saving...' : 'Add' }}</button>
    </div>
  </form>

  <!-- Loading and empty states. We call the signals as functions: loading(), items(). -->
  <p *ngIf="loading()" class="muted">Loading categories...</p>
  <p *ngIf="!loading() && items().length === 0" class="muted">No categories yet. Add one above.</p>

  <!-- The list of categories as simple cards. -->
  <div class="list" *ngIf="!loading()">
    <div class="cat-row" *ngFor="let c of items()">
      <!-- A colored dot showing income (green) or expense (red). -->
      <span class="dot" [class.income]="c.type === 'Income'" [class.expense]="c.type === 'Expense'"></span>
      <span class="cat-name">{{ c.name }}</span>
      <span class="cat-type">{{ c.type }}</span>
      <!-- Delete button on the right. -->
      <button class="del-btn" (click)="remove(c.id)">✕</button>
    </div>
  </div>
</div>
