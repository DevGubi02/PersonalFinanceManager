<!-- The shared top navigation bar. -->
<app-nav></app-nav>

<div class="page">
  <!-- <h2 class="page-title">Budgets</h2> -->

  <!-- Form to add a new monthly budget. -->
  <form class="add-form" (ngSubmit)="add()" novalidate>
    <div class="field-group">
      <label for="budget-category">Category</label>
      <select id="budget-category" name="category" [class.invalid-field]="validationAttempted && !newItem.categoryId" [(ngModel)]="newItem.categoryId" required>
        <option [ngValue]="0" disabled>Choose category</option>
        <option *ngFor="let c of categories()" [ngValue]="c.id">{{ c.name }}</option>
      </select>
    </div>

    <div class="field-group">
      <label for="budget-limit">Monthly Limit</label>
      <input id="budget-limit" name="limit" [class.invalid-field]="validationAttempted && newItem.monthlyLimit <= 0" type="number" min="0" step="0.01"
             [(ngModel)]="newItem.monthlyLimit" placeholder="Monthly limit" required />
    </div>

    <div class="field-group">
      <label for="budget-month">Month</label>
      <input id="budget-month" name="month" [class.invalid-field]="validationAttempted && (newItem.month < 1 || newItem.month > 12)" type="number" min="1" max="12"
             [(ngModel)]="newItem.month" placeholder="Month" required />
    </div>

    <div class="field-group">
      <label for="budget-year">Year</label>
      <input id="budget-year" name="year" [class.invalid-field]="validationAttempted && (newItem.year < 2000 || newItem.year > 2100)" type="number" min="2000" max="2100"
             [(ngModel)]="newItem.year" placeholder="Year" required />
    </div>

    <!-- Add button, disabled while saving. -->
    <div class="field-group">
      <label for="budget-submit">Action</label>
      <button id="budget-submit" type="submit" class="add-btn" [disabled]="saving()">{{ saving() ? 'Saving...' : 'Add' }}</button>
    </div>
  </form>

  <!-- Loading and empty states. -->
  <p *ngIf="loading()" class="muted">Loading budgets...</p>
  <p *ngIf="!loading() && items().length === 0" class="muted">No budgets yet. Set one above.</p>

  <!-- The list of budgets. -->
  <div class="list" *ngIf="!loading()">
    <div class="budget-row" *ngFor="let b of items()">
      <!-- The category name this budget is for. -->
      <span class="b-cat">{{ categoryName(b.categoryId) }}</span>
      <!-- The month/year. -->
      <span class="b-period">{{ b.month }}/{{ b.year }}</span>
      <!-- The limit amount. -->
      <span class="b-limit">{{ b.monthlyLimit | appCurrency }}</span>
      <!-- Delete button. -->
      <button class="del-btn" (click)="remove(b.id)">✕</button>
    </div>
  </div>
</div>
