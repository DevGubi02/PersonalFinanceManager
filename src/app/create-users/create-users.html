<!-- A centered card holding the registration form. -->
<div class="auth-wrapper">
  <div class="auth-card">
    <!-- Title and subtitle. -->
    <h1 class="auth-title">💰 Create Account</h1>
    <p class="auth-subtitle">Start tracking your finances</p>

    <!-- The registration form. (ngSubmit) runs onSubmit(). -->
    <form (ngSubmit)="onSubmit()">
      <!-- Full name input, bound to "fullName". -->
      <label class="field-label">Full Name</label>
      <input class="field-input" type="text" name="fullName"
             [(ngModel)]="fullName" required placeholder="Your name" />

      <!-- Email input, bound to "email". -->
      <label class="field-label">Email</label>
      <input class="field-input" type="email" name="email"
             [(ngModel)]="email" required placeholder="you@example.com" />

      <!-- Secret input, bound to "secretValue". type="password" hides the characters. -->
      <label class="field-label">Password</label>
      <input class="field-input" type="password" name="secret"
             [(ngModel)]="secretValue" required placeholder="At least 8 characters" />

      <!-- Show an error message only if one exists. -->
      <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

      <!-- Submit button, disabled while loading. -->
      <button class="primary-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Creating...' : 'Create Account' }}
      </button>
    </form>

    <!-- A link back to the login page. -->
    <p class="auth-footer">
      Already have an account? <a routerLink="/">Sign in</a>
    </p>
  </div>
</div>
